name: Daily Election Data Auto-Update

on:
  schedule:
    # Run hourly at 15 minutes past the hour
    - cron: '15 * * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub repository actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      # Required to write commits and push back to main branch
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies & Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pypdf Pillow

      - name: Run Scraper and Update Data
        run: |
          python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js ogp-image.png index.html
          
          # Check if there are any modifications staged for commit
          if git diff --cached --quiet; then
            echo "No updates to report. Data is up to date."
          else
            git commit -m "data: Auto-update early voting statistics [skip ci]"
            git push
          fi
